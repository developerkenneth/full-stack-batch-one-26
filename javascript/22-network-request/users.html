<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Songs generator</title>
</head>

<body>

    <style>
        body {
            background-color: #eee;
        }

        main {
            width: 1200px;
            margin: auto;
        }

        .form-input {
            margin-bottom: 25px;
            padding: 10px;

        }

        .form-input>select {
            border: 1px solid #eee;
            padding: 15px;
            width: 250px;
            border-radius: 3px;
        }

        form {
            margin: auto;
            width: 500px;
            box-shadow: 0px 0px 3px #eee;
            padding: 30px;
        }

        .btn {
            background-color: crimson;
            padding: 10px 25px;
            color: #fff;
            border: none;
            border-radius: 3px;
        }

        .container {
            background-color: #fff;
            padding: 45px;
            margin-bottom: 35px;
        }
        .grid{
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }
        .grid-item{
            background-color: #eee;
            padding: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
                        border-radius: 5px;

        }
        .user-card{
            background-color: #fff;
            border-radius: 5px;
            padding: 20px;
            font-family: sans-serif;

        }

        .user-details{
            display: flex;
            justify-content: space-between;
        }

        .role{
            font-weight: 600;
            font-family: sans-serif;
        }

    </style>
    <main>



        <div class="container">
            <h1>See Users</h1>
            <div class="grid">
                
            </div>
        </div>


    </main>

    <script src="./js/users.js"></script>
</body>

</html>
