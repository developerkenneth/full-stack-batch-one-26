<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Songs generator</title>
</head>

<body>

    <style>
        body {
            background-color: #eee;
        }

        main {
            width: 1200px;
            margin: auto;
        }

        .form-input {
            margin-bottom: 25px;
            padding: 10px;

        }

        .form-input>select {
            border: 1px solid #eee;
            padding: 15px;
            width: 250px;
            border-radius: 3px;
        }

        form {
            margin: auto;
            width: 500px;
            box-shadow: 0px 0px 3px #eee;
            padding: 30px;
        }

        .btn {
            background-color: crimson;
            padding: 10px 25px;
            color: #fff;
            border: none;
            border-radius: 3px;
        }

        .container {
            background-color: #fff;
            padding: 45px;
            margin-bottom: 35px;
        }
    </style>
    <main>

        <div class="container">
            <form action="">
                <div class="form-input">
                    <select name="" id="">
                        <option value="song-1">get first song</option>
                        <option value="song-2">get second song</option>
                        <option value="song-3">get fourth song</option>
                        <option value="song-4">get fifth song</option>
                    </select>
                </div>

                <button class="btn" type="submit">
                    send
                </button>

            </form>
        </div>


        <div class="container">
            <h1>See Song Lyrics</h1>
            <div class="song-diplay">

            </div>
        </div>


    </main>

    <script src="./js/app.js"></script>
</body>

</html>
