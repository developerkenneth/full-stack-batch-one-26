<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript - Events</title>
</head>

<body>
    <h1>Javascript Events</h1>
    <p>at the event of something we want to do something else</p>

    <br>

    <form action="">

        <input type="text" placeholder="enter first number" name="" id="number-one">

        <input type="text" placeholder="enter another number" name="" id="number-two">

        <select  id="arith">
            <option value="-">subtract</option>
            <option value="+">add</option>
            <option value="/">divide</option>
            <option value="*">multiply</option>
        </select>

        <button type="submit">Answer</button>

    </form>
    
    <p id="result"></p>



    <!-- external js -->
    <script src="./app.js"></script>

</body>

</html>
